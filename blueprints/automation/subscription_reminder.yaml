blueprint:
  name: Subscription Manager - Subscription Reminder & Notice Deadline Alert
  description: >
    Automatically sends push notifications prior to the next billing date or upcoming notice/cancellation deadline for your subscriptions.
  domain: automation
  input:
    notify_device:
      name: Notification Device
      description: The smartphone or device to receive notifications (Home Assistant Mobile App).
      selector:
        device:
          integration: mobile_app

mode: queued
max: 10

trigger:
  - platform: event
    event_type: subscription_manager_reminder

action:
  - domain: mobile_app
    type: notify
    device_id: !input notify_device
    title: >
      {% if trigger is defined and 'event' in trigger and 'data' in trigger.event %}
        Subscription Reminder: {{ trigger.event.data.name }}
      {% else %}
        Subscription Reminder (Test)
      {% endif %}
    message: >
      {% if trigger is defined and 'event' in trigger and 'data' in trigger.event %}
        {% set data = trigger.event.data %}
        {% if data.is_cancellation_due and data.days_until_cancellation is not none %}
          Notice deadline alert: Notice period for "{{ data.name }}" ends in {{ data.days_until_cancellation }} days (on {{ data.cancellation_deadline }}).
        {% else %}
          Upcoming payment for "{{ data.name }}" of {{ data.cost }} {{ data.currency }} is due in {{ data.days_until_renewal }} days (Payment method: {{ data.payment_method }}).
        {% endif %}
      {% else %}
        This is a test notification for Subscription Manager. When a subscription renewal or cancellation deadline is due, the name, cost, and deadlines will be shown here.
      {% endif %}
    data:
      tag: >
        {% if trigger is defined and 'event' in trigger and 'data' in trigger.event %}
          sub_reminder_{{ trigger.event.data.entry_id }}
        {% else %}
          sub_reminder_test
        {% endif %}
      group: "SubscriptionManager"
      icon: "mdi:calendar-clock"
      clickAction: "/config/integrations/integration/subscription_manager"

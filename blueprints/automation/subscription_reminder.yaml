blueprint:
  name: Subscription Manager - Abo Erinnerung & Fristen-Warnung
  description: >
    Sendet automatisch Benachrichtigungen vor dem nächsten Abrechnungstag oder vor
    Ablauf einer Kündigungsfrist für deine Abonnements.
  domain: automation
  input:
    notify_device:
      name: Benachrichtigungs-Gerät
      description: Das Smartphone/Gerät, das die Benachrichtigung empfangen soll (Home Assistant Mobile App).
      selector:
        device:
          integration: mobile_app

mode: queued
max: 10

trigger:
  - platform: event
    event_type: subscription_manager_reminder

action:
  - domain: mobile_app
    type: notify
    device_id: !input notify_device
    title: >
      {% if trigger is defined and 'event' in trigger and 'data' in trigger.event %}
        Abo-Erinnerung: {{ trigger.event.data.name }}
      {% else %}
        Abo-Erinnerung (Test)
      {% endif %}
    message: >
      {% if trigger is defined and 'event' in trigger and 'data' in trigger.event %}
        {% set data = trigger.event.data %}
        {% if data.is_cancellation_due and data.days_until_cancellation is not none %}
          Achtung: Die Kündigungsfrist für "{{ data.name }}" endet in {{ data.days_until_cancellation }} Tagen (am {{ data.cancellation_deadline }}).
        {% else %}
          Die nächste Abbuchung für "{{ data.name }}" in Höhe von {{ data.cost }} {{ data.currency }} steht in {{ data.days_until_renewal }} Tagen an (Zahlungsart: {{ data.payment_method }}).
        {% endif %}
      {% else %}
        Dies ist eine Test-Benachrichtigung für den Subscription Manager. Wenn ein Abo zur Verlängerung oder Kündigung ansteht, werden hier Name, Kosten und Fristen aufgeführt.
      {% endif %}
    data:
      tag: >
        {% if trigger is defined and 'event' in trigger and 'data' in trigger.event %}
          sub_reminder_{{ trigger.event.data.entry_id }}
        {% else %}
          sub_reminder_test
        {% endif %}
      group: "SubscriptionManager"
      icon: "mdi:calendar-clock"
      clickAction: "/config/integrations/integration/subscription_manager"
